name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nhstrial_test
          POSTGRES_USER: nhstrial
          POSTGRES_PASSWORD: nhstrial
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Run unit and route tests
        run: ./gradlew test --no-daemon
        # Route tests use testApplication with fakes — no DB required

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/

  e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Build application JAR
        run: ./gradlew shadowJar --no-daemon

      - name: Build Docker image
        run: docker build -t nhs-trial-app-kotlin:latest .

      - name: Start app stack
        run: |
          docker compose -f docker-compose.e2e.yml up -d
          # Wait for the /health probe — this hits the DB, so it only succeeds
          # once Flyway has migrated and Exposed has a live connection.
          # GET /person would succeed immediately (no DB call) and mask startup failures.
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 2
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          APP_URL: http://localhost:8080
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down
