services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nhstrial
      POSTGRES_USER: nhstrial
      POSTGRES_PASSWORD: nhstrial
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhstrial"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: nhs-trial-app-kotlin:latest
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/nhstrial
      DATABASE_USERNAME: nhstrial
      DATABASE_PASSWORD: nhstrial
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
